name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  release:
    name: Release ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            pkg: ps1
          - os: ubuntu-22.04
            rid: linux-x64
            pkg: sh
          - os: macos-14
            rid: osx-arm64
            pkg: sh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch standalone Python
        shell: bash  # default shell on Windows is pwsh, which silently no-ops .sh scripts
        run: |
          chmod +x build/*.sh
          ./build/fetch-python.sh ${{ matrix.rid }}

      - name: Install Python deps
        shell: bash
        run: ./build/install-python-deps.sh ${{ matrix.rid }}

      # Fails fast in its own step so a bad transformers pin is obvious in the
      # job summary instead of surfacing as a PyInstaller failure later.
      - name: Verify transformers ties LFM2.5-VL weights
        shell: bash
        run: |
          PY="build/_python/${{ matrix.rid }}/python"
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then PY="$PY/python.exe"; else PY="$PY/bin/python3"; fi
          "$PY" build/check-lfm2vl-tie.py

      - name: Build sidecar (PyInstaller)
        shell: bash
        run: ./build/build-sidecar.sh ${{ matrix.rid }}

      - name: Publish Avalonia app
        run: >
          dotnet publish src/Synapic.Avalonia -c Release -r ${{ matrix.rid }}
          --self-contained ${{ matrix.rid == 'win-x64' && 'false' || 'true' }}
          -p:PublishSingleFile=false
          -o artifacts/${{ matrix.rid }}

      - name: Install Inno Setup (Windows)
        if: matrix.pkg == 'ps1'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package (Windows)
        if: matrix.pkg == 'ps1'
        shell: pwsh
        env:
          SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
        run: ./build/package-windows.ps1 -Rid ${{ matrix.rid }} -AppVersion ${{ steps.ver.outputs.version }}

      - name: Package (Linux)
        if: matrix.pkg == 'sh' && matrix.rid == 'linux-x64'
        shell: bash
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          chmod +x build/package-linux.sh
          ./build/package-linux.sh ${{ matrix.rid }} artifacts/${{ matrix.rid }}

      - name: Package (macOS)
        if: matrix.pkg == 'sh' && startsWith(matrix.rid, 'osx')
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x build/package-macos.sh
          ./build/package-macos.sh ${{ matrix.rid }} artifacts/${{ matrix.rid }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/Synapic-Setup-*.exe
            artifacts/${{ matrix.rid }}/*.AppImage
            artifacts/${{ matrix.rid }}/*.dmg
            artifacts/${{ matrix.rid }}/Synapic-*.dmg
          if-no-files-found: warn

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
