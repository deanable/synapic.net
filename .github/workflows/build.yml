name: Build & Package

on:
  push:
    branches: [main]
  pull_request:
    # Path filter keeps doc-only PRs from burning the expensive build matrix
    # (Windows + 2x macOS) plus the installer smoke test.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build/**'
      - '.github/workflows/**'
      - '*.sln'
      - 'global.json'
      - 'Directory.Build.props'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PYTHON_VERSION: '3.11'

jobs:
  python-tests:
    name: Python sidecar tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # Versions mirror src/Synapic.Inference/requirements.txt minus torch/transformers:
          # the contract tests import the sidecar entry module (fastapi, uvicorn)
          # and monkeypatch huggingface_hub snapshot paths; no torch needed.
          pip install pytest httpx fastapi==0.119.0 uvicorn==0.38.0 pillow==12.0.0 huggingface_hub==1.3.3
      - name: Run sidecar tests (no torch required)
        run: python -m pytest tests/Synapic.Inference.Tests -v

      # The protocol doc is generated from the FastAPI OpenAPI schema + the C#
      # contract DTOs; this fails when the committed file is stale or when the
      # two sides disagree on a request field set.
      - name: Verify sidecar protocol doc is up to date
        run: python build/generate-protocol-doc.py --check

  dotnet-tests:
    name: .NET tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build Synapic.Net.sln -c Release
      - name: Test
        run: dotnet test Synapic.Net.sln -c Release --no-build --nologo

  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: [python-tests, dotnet-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            sidecar: synapic-inference.exe
            pkg: ps1
          - os: ubuntu-22.04
            rid: linux-x64
            sidecar: synapic-inference
            pkg: sh
          - os: macos-14
            rid: osx-arm64
            sidecar: synapic-inference
            pkg: sh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Fetch standalone Python
        shell: bash  # default shell on Windows is pwsh, which silently no-ops .sh scripts
        run: |
          chmod +x build/*.sh
          ./build/fetch-python.sh ${{ matrix.rid }}

      - name: Install Python deps
        shell: bash
        run: ./build/install-python-deps.sh ${{ matrix.rid }}

      # Fails fast in its own step so a bad transformers pin is obvious in the
      # job summary instead of surfacing as a PyInstaller failure later.
      - name: Verify transformers ties LFM2.5-VL weights
        shell: bash
        run: |
          PY="build/_python/${{ matrix.rid }}/python"
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then PY="$PY/python.exe"; else PY="$PY/bin/python3"; fi
          "$PY" build/check-lfm2vl-tie.py

      - name: Build sidecar (PyInstaller)
        shell: bash
        run: ./build/build-sidecar.sh ${{ matrix.rid }}

      - name: Publish Avalonia app
        run: >
          dotnet publish src/Synapic.Avalonia -c Release -r ${{ matrix.rid }}
          --self-contained ${{ matrix.rid == 'win-x64' && 'false' || 'true' }}
          -p:PublishSingleFile=false
          -o artifacts/${{ matrix.rid }}

      - name: Stage bundle (sidecar next to app)
        shell: bash
        run: |
          cp artifacts/${{ matrix.rid }}/synapic-inference* artifacts/${{ matrix.rid }}/ 2>/dev/null || true
          ls -lh artifacts/${{ matrix.rid }}

      - name: Install Inno Setup (Windows)
        if: matrix.pkg == 'ps1'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package installer (Windows)
        if: matrix.pkg == 'ps1'
        shell: pwsh
        run: ./build/package-windows.ps1 -Rid ${{ matrix.rid }} -AppVersion 1.0.0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Synapic-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/*
            !artifacts/${{ matrix.rid }}/**/*.pdb
          retention-days: 7

  # CUDA is a packaging variant, not a different program: the same sidecar built
  # against CUDA torch wheels, and CUDA only exists for Windows
  # (InferenceSidecarService.BuildableRids). Bundling CUDA wheels needs no GPU, so
  # a GitHub-hosted runner can build it; what it cannot do is prove GPU inference
  # works (the smoke test below asserts the bundle boots and serves /health on a
  # machine with no NVIDIA driver, i.e. that the CUDA wheels still degrade to CPU).
  sidecar-cuda:
    name: Build sidecar win-x64-cuda (CUDA 12.6)
    runs-on: windows-2022
    needs: [python-tests, dotnet-tests]
    # ~3 GB of cu126 wheels in, a ~2.7 GB single-file bundle out: too expensive
    # for every PR. Runs on main pushes + manual dispatch, or a PR labelled
    # `build-cuda` when the packaging path itself changes.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'build-cuda')
    steps:
      - uses: actions/checkout@v4

      - name: Fetch standalone Python
        run: ./build/fetch-python.ps1 -Rid win-x64-cuda

      - name: Install Python deps (cu126 wheels)
        run: ./build/install-python-deps.ps1 -Rid win-x64-cuda

      # Fail before the 20-minute PyInstaller run when the wrong wheels landed.
      - name: Verify torch is a CUDA build
        run: |
          $py = "build/_python/win-x64-cuda/python/python.exe"
          $version = & $py -c "import torch; print(torch.__version__)"
          $cuda = & $py -c "import torch; print(torch.version.cuda or 'none')"
          Write-Host "torch $version (cuda $cuda)"
          if ($cuda -notmatch '^12\.') {
            Write-Host "::error::CPU torch wheels were installed - expected a CUDA 12.x build (got '$cuda')"
            exit 1
          }

      # build-sidecar.ps1 also asserts the packaged payload really is the CUDA
      # variant (build/check-sidecar-variant.py), so a wrong-wheels bundle cannot
      # reach the upload below.
      - name: Build sidecar (PyInstaller)
        run: ./build/build-sidecar.ps1 -Rid win-x64-cuda

      # SYNAPIC_DISABLE_AUTO_DOWNLOAD keeps the 860 MB default-model fetch out of
      # CI; the port-file handshake mirrors what the Avalonia host does.
      - name: Smoke test the bundle (boots and serves /health with no GPU)
        run: |
          $exe = "artifacts/win-x64-cuda/synapic-inference.exe"
          $portFile = Join-Path $env:RUNNER_TEMP 'synapic_cuda_port.txt'
          Remove-Item $portFile -ErrorAction SilentlyContinue
          $env:SYNAPIC_PORT_FILE = $portFile
          $env:SYNAPIC_DISABLE_AUTO_DOWNLOAD = '1'

          $p = Start-Process $exe -ArgumentList '--port=0' -PassThru `
            -RedirectStandardOutput cuda-stdout.txt -RedirectStandardError cuda-stderr.txt

          # A 2.7 GB onefile unpacks itself on first launch; that dominates startup.
          $deadline = (Get-Date).AddSeconds(300)
          $ready = $false
          $port = 0
          $health = $null
          while ((Get-Date) -lt $deadline) {
            if ($p.HasExited) { break }
            if (Test-Path $portFile) {
              $line = (Get-Content $portFile -First 1).Trim()
              if ($line -match '^\d+$') {
                $port = [int]$line
                try {
                  $health = Invoke-RestMethod "http://127.0.0.1:$port/health" -TimeoutSec 5
                  if ($health.status -eq 'ready') { $ready = $true; break }
                } catch { }
              }
            }
            Start-Sleep -Seconds 3
          }

          if (-not $ready) {
            Write-Host "=== stdout (last 40) ==="
            Get-Content cuda-stdout.txt -ErrorAction SilentlyContinue | Select-Object -Last 40 | Write-Host
            Write-Host "=== stderr (last 40) ==="
            Get-Content cuda-stderr.txt -ErrorAction SilentlyContinue | Select-Object -Last 40 | Write-Host
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Write-Host "::error::the CUDA bundle never reported ready (port file '$portFile', port '$port')"
            exit 1
          }

          # NB: ${port} - "$port:" parses as a scoped variable reference in PowerShell.
          Write-Host "Ready on port ${port}: $($health | ConvertTo-Json -Compress)"
          Write-Host "device reported: $($health.device)"
          try { Invoke-RestMethod "http://127.0.0.1:$port/shutdown" -Method Post -TimeoutSec 15 | Out-Null } catch { }
          $p.WaitForExit(30000) | Out-Null
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Write-Host "Smoke test passed - the CUDA bundle boots with no GPU present."

      - name: Checksum the bundle
        run: |
          $exe = "artifacts/win-x64-cuda/synapic-inference.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $sizeGb = [math]::Round((Get-Item $exe).Length / 1GB, 2)
          "SHA256 (synapic-inference.exe) = $hash" | Set-Content artifacts/win-x64-cuda/SHA256SUMS.txt
          Write-Host "CUDA sidecar: $sizeGb GB, sha256 $hash"

      # Note: GitHub Release assets are capped at 2 GiB per file, so this bundle
      # cannot be published as a single release asset - split it first.
      - name: Upload the CUDA sidecar
        uses: actions/upload-artifact@v4
        with:
          name: Synapic-sidecar-win-x64-cuda
          path: |
            artifacts/win-x64-cuda/synapic-inference.exe
            artifacts/win-x64-cuda/SHA256SUMS.txt
          retention-days: 7

  installer-smoke:
    name: Installer smoke test (win-x64)
    runs-on: windows-2022
    needs: [build]
    # Skip on PRs (extra Windows minutes); the merge gate runs on main pushes
    # and manual dispatch.
    if: github.event_name != 'pull_request'
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: Synapic-win-x64
          path: installer

      - name: Baseline .NET state
        shell: pwsh
        run: |
          dotnet --list-runtimes
          $v = (Get-ItemProperty 'HKLM:\SOFTWARE\dotnet\Setup\InstalledVersions\x64\sharedhost' -ErrorAction SilentlyContinue).Version
          Write-Host "sharedhost Version: $v"

      # The dev-box equivalent is blocked by SDK/VS dependents on the burn
      # engine; dotnet-core-uninstall bypasses that. Best effort: if it fails
      # the run degrades to the runtime-present install path only.
      - name: Strip .NET SDKs and runtimes (forces the prerequisite path)
        continue-on-error: true
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'dcu'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $release = Invoke-RestMethod 'https://api.github.com/repos/dotnet/cli-lab/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like 'dotnet-core-uninstall*.zip' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile "$tmp\dcu.zip"
          Expand-Archive "$tmp\dcu.zip" -DestinationPath $tmp
          $exe = Get-ChildItem $tmp -Recurse -Filter dotnet-core-uninstall.exe | Select-Object -First 1 -ExpandProperty FullName
          & $exe list
          & $exe remove --sdk --runtime --aspnet-runtime --windows-desktop --hosting-bundled --all --force
          exit $LASTEXITCODE

      - name: Detect whether the prerequisite path is exercised
        shell: pwsh
        run: |
          $run = dotnet --list-runtimes 2>$null
          $hasDesktop = @($run) -match 'Microsoft.WindowsDesktop.App 10\.'
          if ($hasDesktop.Count -gt 0) {
            Write-Host "Desktop runtime still present — prerequisite path will NOT be exercised"
          } else {
            Write-Host "Desktop runtime absent — setup must install it as a prerequisite"
          }

      - name: Run installer silently
        shell: pwsh
        run: |
          $setup = 'installer\Synapic-Setup-win-x64.exe'
          if (-not (Test-Path $setup)) { Write-Host "::error::Setup exe not found"; exit 1 }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=setup.log' -Wait -PassThru
          Write-Host "Setup exit code: $($p.ExitCode)"
          Get-Content setup.log -ErrorAction SilentlyContinue | Write-Host
          if ($p.ExitCode -notin 0, 3010) { exit 1 }
          if (-not (Test-Path 'C:\Program Files\Synapic\Synapic.exe')) { Write-Host "::error::App not installed"; exit 1 }
          if (-not (Select-String -Path setup.log -Pattern 'Installation process succeeded' -Quiet)) { Write-Host "::error::Setup log missing success marker"; exit 1 }

      # When the strip succeeded this proves the prerequisite ran (the only
      # way the runtime can be present again); otherwise it re-checks leg A.
      - name: Verify .NET Desktop Runtime present after install
        shell: pwsh
        run: |
          $run = dotnet --list-runtimes 2>$null
          @($run) | ForEach-Object { Write-Host $_ }
          if (-not (@($run) -match 'Microsoft.WindowsDesktop.App 10\.')) {
            Write-Host "::error::.NET Desktop Runtime 10.x missing after install"
            exit 1
          }

      - name: Launch installed app and verify runtime-check log
        shell: pwsh
        run: |
          $cfg = Join-Path $env:APPDATA 'Synapic'
          New-Item -ItemType Directory -Force $cfg | Out-Null
          Set-Content (Join-Path $cfg 'config.json') '{"Ui":{"AutoLaunchSidecar":false}}'
          # Log goes to <appdir>\logs when writable, else %LOCALAPPDATA% fallback.
          $paths = @('C:\Program Files\Synapic\logs\synapic.log',
                     (Join-Path $env:LOCALAPPDATA 'Synapic\logs\synapic.log'))
          $p = Start-Process 'C:\Program Files\Synapic\Synapic.exe' -PassThru `
            -RedirectStandardOutput app-stdout.txt -RedirectStandardError app-stderr.txt
          $deadline = (Get-Date).AddSeconds(120)
          $found = $false; $hit = $null
          while ((Get-Date) -lt $deadline) {
            if ($p.HasExited) { break }
            foreach ($cand in $paths) {
              if ((Test-Path $cand) -and (Select-String -Path $cand -Pattern '\[runtime\]' -Quiet)) { $found = $true; $hit = $cand; break }
            }
            if ($found) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Write-Host "Process HasExited: $($p.HasExited)$(if ($p.HasExited) { '; ExitCode: ' + $p.ExitCode })"
          foreach ($stream in 'app-stdout.txt', 'app-stderr.txt') {
            if ((Test-Path $stream) -and ((Get-Item $stream).Length -gt 0)) {
              Write-Host "=== $stream ==="; Get-Content $stream | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
            }
          }
          # .NET unhandled exceptions land here with full stack traces.
          Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue |
            Where-Object { $_.TimeCreated -gt (Get-Date).AddMinutes(-6) -and $_.LevelDisplayName -eq 'Error' } |
            Select-Object -First 6 | ForEach-Object { Write-Host "=== event $($_.Id) $($_.ProviderName) ==="; $_.Message.Substring(0, [Math]::Min(1500, $_.Message.Length)) }
          foreach ($cand in $paths) {
            if (Test-Path $cand) { Write-Host "=== $cand ==="; Get-Content $cand | Select-Object -First 40 | ForEach-Object { Write-Host $_ } }
            else { Write-Host "(absent) $cand" }
          }
          if (-not $found) { Write-Host "::error::'[runtime]' line not found in any app log"; exit 1 }
          Write-Host "App launched; runtime check logged ($hit)."
