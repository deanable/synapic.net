name: Build & Package

on:
  push:
    branches: [main]
  pull_request:
    # Path filter keeps doc-only PRs from burning the expensive build matrix
    # (Windows + 2x macOS) plus the installer smoke test.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build/**'
      # The user help is part of the app payload now (help/ on every RID, and
      # Synapic.chm on Windows), so a help-only change needs this workflow.
      - 'docs/help/**'
      - '.github/workflows/**'
      - '*.sln'
      - 'global.json'
      - 'Directory.Build.props'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PYTHON_VERSION: '3.11'

jobs:
  python-tests:
    name: Python sidecar tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # Versions mirror src/Synapic.Inference/requirements.txt minus torch/transformers:
          # the contract tests import the sidecar entry module (fastapi, uvicorn)
          # and monkeypatch huggingface_hub snapshot paths; no torch needed.
          pip install pytest httpx fastapi==0.119.0 uvicorn==0.38.0 pillow==12.0.0 huggingface_hub==1.3.3
      - name: Run sidecar tests (no torch required)
        run: python -m pytest tests/Synapic.Inference.Tests -v

      # The protocol doc is generated from the FastAPI OpenAPI schema + the C#
      # contract DTOs; this fails when the committed file is stale or when the
      # two sides disagree on a request field set.
      - name: Verify sidecar protocol doc is up to date
        run: python build/generate-protocol-doc.py --check

      # Same idea for the user help, which the app now opens (Help button / F1)
      # and therefore ships: dead links, topics missing from the .hhp [FILES]
      # list, unresolvable anchors and non-ASCII bytes. Needs nothing but
      # Python, so it runs on the cheap Linux job rather than only where
      # hhc.exe exists.
      - name: Check the help sources
        run: python docs/help/check-help.py

  dotnet-tests:
    name: .NET tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build Synapic.Net.sln -c Release
      - name: Test
        run: dotnet test Synapic.Net.sln -c Release --no-build --nologo

  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: [python-tests, dotnet-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            sidecar: synapic-inference.exe
            pkg: ps1
          - os: ubuntu-22.04
            rid: linux-x64
            sidecar: synapic-inference
            pkg: sh
          - os: macos-14
            rid: osx-arm64
            sidecar: synapic-inference
            pkg: sh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Fetch standalone Python
        shell: bash  # default shell on Windows is pwsh, which silently no-ops .sh scripts
        run: |
          chmod +x build/*.sh
          ./build/fetch-python.sh ${{ matrix.rid }}

      - name: Install Python deps
        shell: bash
        run: ./build/install-python-deps.sh ${{ matrix.rid }}

      # Fails fast in its own step so a bad transformers pin is obvious in the
      # job summary instead of surfacing as a PyInstaller failure later.
      - name: Verify transformers ties LFM2.5-VL weights
        shell: bash
        run: |
          PY="build/_python/${{ matrix.rid }}/python"
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then PY="$PY/python.exe"; else PY="$PY/bin/python3"; fi
          "$PY" build/check-lfm2vl-tie.py

      - name: Build sidecar (PyInstaller)
        shell: bash
        run: ./build/build-sidecar.sh ${{ matrix.rid }}

      # The compiled .chm is now the whole of the Windows help payload: it is
      # embedded in the assembly and checked against a SHA-256 before it is
      # opened (docs/help/README.md). A Windows build that ships without it has
      # no help at all, so this step fails rather than warning.
      #
      # The compiler has to be installed first. windows-2022 has an hhc.exe in
      # the Windows SDK that exits 0 having written nothing, which is why the
      # old step tolerated a missing .chm.
      #
      # The installer is vendored in build/vendor/html-help-workshop and hash-
      # checked by the script, rather than taken from chocolatey or downloaded:
      # a release should not need a third-party package manager to produce its
      # own payload, and Microsoft no longer links to the only copy of this tool
      # that still works. See that directory's README for provenance.
      - name: Install the HTML Help Workshop compiler
        if: matrix.pkg == 'ps1'
        shell: pwsh
        run: ./build/install-html-help-workshop.ps1

      - name: Compile the Windows help (.chm)
        if: matrix.pkg == 'ps1'
        shell: pwsh
        run: |
          # No -AllowMissingCompiler: this is the payload, not a nicety.
          ./docs/help/build-chm.ps1
          if (-not (Test-Path docs/help/Synapic.chm)) {
            throw "The help compiled to nothing. The app would ship with no help on Windows."
          }
          if (-not (Test-Path docs/help/help-payload.json)) {
            throw "The help compiled but no SHA-256 manifest was written, so the app would refuse to open it."
          }
          Write-Host "Help payload ready: $((Get-Item docs/help/Synapic.chm).Length) bytes"

      - name: Publish Avalonia app
        run: >
          dotnet publish src/Synapic.Avalonia -c Release -r ${{ matrix.rid }}
          --self-contained ${{ matrix.rid == 'win-x64' && 'false' || 'true' }}
          -p:PublishSingleFile=false
          -o artifacts/${{ matrix.rid }}

      - name: Stage bundle (sidecar next to app)
        shell: bash
        run: |
          cp artifacts/${{ matrix.rid }}/synapic-inference* artifacts/${{ matrix.rid }}/ 2>/dev/null || true
          ls -lh artifacts/${{ matrix.rid }}

      - name: Install Inno Setup (Windows)
        if: matrix.pkg == 'ps1'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package installer (Windows)
        if: matrix.pkg == 'ps1'
        shell: pwsh
        run: ./build/package-windows.ps1 -Rid ${{ matrix.rid }} -AppVersion 1.0.0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Synapic-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/*
            !artifacts/${{ matrix.rid }}/**/*.pdb
          retention-days: 7

  # CUDA is a packaging variant, not a different program: the same sidecar built
  # against CUDA torch wheels, and CUDA only exists for Windows
  # (InferenceSidecarService.BuildableRids). Bundling CUDA wheels needs no GPU, so
  # a GitHub-hosted runner can build it; what it cannot do is prove GPU inference
  # works (the smoke test below asserts the bundle boots and serves /health on a
  # machine with no NVIDIA driver, i.e. that the CUDA wheels still degrade to CPU).
  sidecar-cuda:
    name: Build sidecar win-x64-cuda (CUDA 12.6)
    runs-on: windows-2022
    needs: [python-tests, dotnet-tests]
    # ~3 GB of cu126 wheels in, a ~2.7 GB single-file bundle out: too expensive
    # for every PR. Runs on main pushes + manual dispatch, or a PR labelled
    # `build-cuda` when the packaging path itself changes.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'build-cuda')
    steps:
      - uses: actions/checkout@v4

      - name: Fetch standalone Python
        run: ./build/fetch-python.ps1 -Rid win-x64-cuda

      - name: Install Python deps (cu126 wheels)
        run: ./build/install-python-deps.ps1 -Rid win-x64-cuda

      # Fail before the 20-minute PyInstaller run when the wrong wheels landed.
      - name: Verify torch is a CUDA build
        run: |
          $py = "build/_python/win-x64-cuda/python/python.exe"
          $version = & $py -c "import torch; print(torch.__version__)"
          $cuda = & $py -c "import torch; print(torch.version.cuda or 'none')"
          Write-Host "torch $version (cuda $cuda)"
          if ($cuda -notmatch '^12\.') {
            Write-Host "::error::CPU torch wheels were installed - expected a CUDA 12.x build (got '$cuda')"
            exit 1
          }

      # build-sidecar.ps1 also asserts the packaged payload really is the CUDA
      # variant (build/check-sidecar-variant.py), so a wrong-wheels bundle cannot
      # reach the upload below.
      - name: Build sidecar (PyInstaller)
        run: ./build/build-sidecar.ps1 -Rid win-x64-cuda

      # SYNAPIC_DISABLE_AUTO_DOWNLOAD keeps the 860 MB default-model fetch out of
      # CI; the port-file handshake mirrors what the Avalonia host does.
      - name: Smoke test the bundle (boots and serves /health with no GPU)
        run: |
          $exe = "artifacts/win-x64-cuda/synapic-inference.exe"
          $portFile = Join-Path $env:RUNNER_TEMP 'synapic_cuda_port.txt'
          Remove-Item $portFile -ErrorAction SilentlyContinue
          $env:SYNAPIC_PORT_FILE = $portFile
          $env:SYNAPIC_DISABLE_AUTO_DOWNLOAD = '1'

          $p = Start-Process $exe -ArgumentList '--port=0' -PassThru `
            -RedirectStandardOutput cuda-stdout.txt -RedirectStandardError cuda-stderr.txt

          # A 2.7 GB onefile unpacks itself on first launch; that dominates startup.
          $deadline = (Get-Date).AddSeconds(300)
          $ready = $false
          $port = 0
          $health = $null
          while ((Get-Date) -lt $deadline) {
            if ($p.HasExited) { break }
            if (Test-Path $portFile) {
              $line = (Get-Content $portFile -First 1).Trim()
              if ($line -match '^\d+$') {
                $port = [int]$line
                try {
                  $health = Invoke-RestMethod "http://127.0.0.1:$port/health" -TimeoutSec 5
                  if ($health.status -eq 'ready') { $ready = $true; break }
                } catch { }
              }
            }
            Start-Sleep -Seconds 3
          }

          if (-not $ready) {
            Write-Host "=== stdout (last 40) ==="
            Get-Content cuda-stdout.txt -ErrorAction SilentlyContinue | Select-Object -Last 40 | Write-Host
            Write-Host "=== stderr (last 40) ==="
            Get-Content cuda-stderr.txt -ErrorAction SilentlyContinue | Select-Object -Last 40 | Write-Host
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Write-Host "::error::the CUDA bundle never reported ready (port file '$portFile', port '$port')"
            exit 1
          }

          # NB: ${port} - "$port:" parses as a scoped variable reference in PowerShell.
          Write-Host "Ready on port ${port}: $($health | ConvertTo-Json -Compress)"
          Write-Host "device reported: $($health.device)"
          try { Invoke-RestMethod "http://127.0.0.1:$port/shutdown" -Method Post -TimeoutSec 15 | Out-Null } catch { }
          $p.WaitForExit(30000) | Out-Null
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Write-Host "Smoke test passed - the CUDA bundle boots with no GPU present."

      - name: Checksum the bundle
        run: |
          $exe = "artifacts/win-x64-cuda/synapic-inference.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $sizeGb = [math]::Round((Get-Item $exe).Length / 1GB, 2)
          "SHA256 (synapic-inference.exe) = $hash" | Set-Content artifacts/win-x64-cuda/SHA256SUMS.txt
          Write-Host "CUDA sidecar: $sizeGb GB, sha256 $hash"

      # Note: GitHub Release assets are capped at 2 GiB per file, so this bundle
      # cannot be published as a single release asset - split it first.
      - name: Upload the CUDA sidecar
        uses: actions/upload-artifact@v4
        with:
          name: Synapic-sidecar-win-x64-cuda
          path: |
            artifacts/win-x64-cuda/synapic-inference.exe
            artifacts/win-x64-cuda/SHA256SUMS.txt
          retention-days: 7

  installer-smoke:
    name: Installer smoke test (win-x64)
    runs-on: windows-2022
    needs: [build]
    # Skip on PRs (extra Windows minutes); the merge gate runs on main pushes
    # and manual dispatch.
    if: github.event_name != 'pull_request'
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: Synapic-win-x64
          path: installer

      - name: Baseline .NET state
        shell: pwsh
        run: |
          dotnet --list-runtimes
          $v = (Get-ItemProperty 'HKLM:\SOFTWARE\dotnet\Setup\InstalledVersions\x64\sharedhost' -ErrorAction SilentlyContinue).Version
          Write-Host "sharedhost Version: $v"

      # The dev-box equivalent is blocked by SDK/VS dependents on the burn
      # engine; dotnet-core-uninstall bypasses that. Best effort: if it fails
      # the run degrades to the runtime-present install path only, which the next
      # step reports either way.
      #
      # It ships as a Windows .msi and macOS tarballs - never the .zip this used
      # to look for, which is why the asset lookup came back empty and the strip
      # silently stripped nothing. The release lookup is authenticated because an
      # anonymous one is rate-limited, and the pinned URL is the fallback so a
      # release rename cannot leave the job unstripped and untested again.
      - name: Strip .NET SDKs and runtimes (forces the prerequisite path)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'dcu'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $msi = Join-Path $tmp 'dotnet-core-uninstall.msi'
          $url = 'https://github.com/dotnet/cli-lab/releases/download/1.7.661902/dotnet-core-uninstall.msi'
          try {
            $release = Invoke-RestMethod 'https://api.github.com/repos/dotnet/cli-lab/releases/latest' `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
            $asset = $release.assets | Where-Object { $_.name -like 'dotnet-core-uninstall*.msi' } | Select-Object -First 1
            if ($asset) { $url = $asset.browser_download_url } else { Write-Host 'No .msi in the latest release; using the pinned download.' }
          } catch {
            Write-Host "Release lookup failed ($($_.Exception.Message)); using the pinned download."
          }
          Invoke-WebRequest $url -OutFile $msi
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          Write-Host "dotnet-core-uninstall.msi exit code: $($install.ExitCode)"
          if ($install.ExitCode -notin 0, 3010) { exit 1 }

          # The MSI's install folder is not ours to assume: look for its own
          # directory under either Program Files root.
          $exe = $null
          foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
            $dir = Get-ChildItem -Path $root -Directory -Filter 'dotnet-core-uninstall*' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $dir) { continue }
            $exe = Get-ChildItem -Path $dir.FullName -Filter 'dotnet-core-uninstall.exe' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if ($exe) { break }
          }
          if (-not $exe) { Write-Host '::error::dotnet-core-uninstall.exe was installed but not found'; exit 1 }

          & $exe list
          & $exe remove --sdk --runtime --aspnet-runtime --windows-desktop --hosting-bundled --all --force
          exit $LASTEXITCODE

      - name: Detect whether the prerequisite path is exercised
        shell: pwsh
        run: |
          $run = dotnet --list-runtimes 2>$null
          $hasDesktop = @($run) -match 'Microsoft.WindowsDesktop.App 10\.'
          if ($hasDesktop.Count -gt 0) {
            Write-Host "Desktop runtime still present — prerequisite path will NOT be exercised"
          } else {
            Write-Host "Desktop runtime absent — setup must install it as a prerequisite"
          }

      - name: Run installer silently
        shell: pwsh
        run: |
          $setup = 'installer\Synapic-Setup-win-x64.exe'
          if (-not (Test-Path $setup)) { Write-Host "::error::Setup exe not found"; exit 1 }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=setup.log' -Wait -PassThru
          Write-Host "Setup exit code: $($p.ExitCode)"
          Get-Content setup.log -ErrorAction SilentlyContinue | Write-Host
          if ($p.ExitCode -notin 0, 3010) { exit 1 }
          if (-not (Test-Path 'C:\Program Files\Synapic\Synapic.exe')) { Write-Host "::error::App not installed"; exit 1 }
          if (-not (Select-String -Path setup.log -Pattern 'Installation process succeeded' -Quiet)) { Write-Host "::error::Setup log missing success marker"; exit 1 }

      # When the strip succeeded this proves the prerequisite ran (the only
      # way the runtime can be present again); otherwise it re-checks leg A.
      - name: Verify .NET Desktop Runtime present after install
        shell: pwsh
        run: |
          $run = dotnet --list-runtimes 2>$null
          @($run) | ForEach-Object { Write-Host $_ }
          if (-not (@($run) -match 'Microsoft.WindowsDesktop.App 10\.')) {
            Write-Host "::error::.NET Desktop Runtime 10.x missing after install"
            exit 1
          }

      - name: Launch installed app and verify runtime-check log
        shell: pwsh
        run: |
          $cfg = Join-Path $env:APPDATA 'Synapic'
          New-Item -ItemType Directory -Force $cfg | Out-Null
          Set-Content (Join-Path $cfg 'config.json') '{"Ui":{"AutoLaunchSidecar":false}}'
          # Log goes to <appdir>\logs when writable, else %LOCALAPPDATA% fallback.
          $paths = @('C:\Program Files\Synapic\logs\synapic.log',
                     (Join-Path $env:LOCALAPPDATA 'Synapic\logs\synapic.log'))
          $p = Start-Process 'C:\Program Files\Synapic\Synapic.exe' -PassThru `
            -RedirectStandardOutput app-stdout.txt -RedirectStandardError app-stderr.txt
          $deadline = (Get-Date).AddSeconds(120)
          $found = $false; $hit = $null
          while ((Get-Date) -lt $deadline) {
            if ($p.HasExited) { break }
            foreach ($cand in $paths) {
              if ((Test-Path $cand) -and (Select-String -Path $cand -Pattern '\[runtime\]' -Quiet)) { $found = $true; $hit = $cand; break }
            }
            if ($found) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Write-Host "Process HasExited: $($p.HasExited)$(if ($p.HasExited) { '; ExitCode: ' + $p.ExitCode })"
          foreach ($stream in 'app-stdout.txt', 'app-stderr.txt') {
            if ((Test-Path $stream) -and ((Get-Item $stream).Length -gt 0)) {
              Write-Host "=== $stream ==="; Get-Content $stream | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
            }
          }
          # .NET unhandled exceptions land here with full stack traces.
          Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue |
            Where-Object { $_.TimeCreated -gt (Get-Date).AddMinutes(-6) -and $_.LevelDisplayName -eq 'Error' } |
            Select-Object -First 6 | ForEach-Object { Write-Host "=== event $($_.Id) $($_.ProviderName) ==="; $_.Message.Substring(0, [Math]::Min(1500, $_.Message.Length)) }
          foreach ($cand in $paths) {
            if (Test-Path $cand) { Write-Host "=== $cand ==="; Get-Content $cand | Select-Object -First 40 | ForEach-Object { Write-Host $_ } }
            else { Write-Host "(absent) $cand" }
          }
          if (-not $found) { Write-Host "::error::'[runtime]' line not found in any app log"; exit 1 }
          Write-Host "App launched; runtime check logged ($hit)."

      # The dialog is the app's own recovery path, and it can only be exercised
      # on a machine that is missing the runtime while the app can still start:
      # the payload is a framework-dependent publish, so Microsoft.NETCore.App has
      # to stay and only the desktop framework goes.
      #
      # That framework is taken away by moving its folder out of
      # dotnet\shared, which is exactly what the check reads (and what a real
      # removal leaves behind). Uninstalling it instead would mean downloading
      # dotnet-core-uninstall, whose latest release no longer ships the .zip the
      # strip step above looks for, and on a runner with Visual Studio installed
      # it can refuse to remove a desktop runtime at all. Whatever happens below,
      # the folder goes back.
      #
      # The silent install must not then quietly repair the machine: with network
      # access it would succeed and no dialog would ever appear. Two independent
      # blocks, because this step has to fail loudly when the failure branch was
      # never reached.
      #
      # And the assertion is the dialog itself, not the log line: a misspelled
      # binding fails silently. Windows PowerShell 5.1 runs this step because UI
      # Automation ships with the .NET Framework, so reading the dialog still
      # works with the desktop runtime out of the way.
      - name: Assert the dialog offers the download link when the runtime is missing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes

          $url = 'https://dotnet.microsoft.com/download/dotnet/10.0'
          $app = 'C:\Program Files\Synapic\Synapic.exe'
          $framework = Join-Path $env:ProgramFiles 'dotnet\shared\Microsoft.WindowsDesktop.App'
          $stash = "$framework.smoke-stash"
          $logPaths = @('C:\Program Files\Synapic\logs\synapic.log',
                        (Join-Path $env:LOCALAPPDATA 'Synapic\logs\synapic.log'))
          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          $hostsBackup = Join-Path $env:RUNNER_TEMP 'hosts.synapic-backup'

          # A dead proxy blocks the app's own download even when the hosts entry
          # below cannot be written. api.github.com is exempt so the update check
          # does not fail for an unrelated reason.
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:NO_PROXY = 'api.github.com'

          $dialog = $null
          $dialogTitle = ''
          $titles = @()
          $p = $null
          try {
            if (-not (Test-Path -LiteralPath $framework)) {
              throw "no desktop framework at $framework - nothing to take away, so the dialog path cannot be exercised"
            }
            if (Test-Path -LiteralPath $stash) { Remove-Item -LiteralPath $stash -Recurse -Force }
            Move-Item -LiteralPath $framework -Destination $stash
            Write-Host "Desktop framework moved to $stash"

            $run = dotnet --list-runtimes 2>$null
            @($run) | ForEach-Object { Write-Host $_ }
            if (@($run) -match 'Microsoft\.WindowsDesktop\.App 10\.') {
              throw 'the check would still see a desktop runtime, so this run would prove nothing'
            }
            if (-not (@($run) -match 'Microsoft\.NETCore\.App 10\.')) {
              throw 'Microsoft.NETCore.App 10.x is missing too - a framework-dependent app cannot start without it, so no dialog can appear'
            }

            $hostsBlocked = $false
            try {
              Copy-Item $hosts $hostsBackup -Force
              Add-Content -Path $hosts -Value "`n127.0.0.1 builds.dotnet.microsoft.com # synapic dialog smoke"
              $ip = Resolve-DnsName builds.dotnet.microsoft.com -Type A -ErrorAction SilentlyContinue |
                Where-Object { $_.Type -eq 'A' } | Select-Object -First 1 -ExpandProperty IPAddress
              $hostsBlocked = ($ip -eq '127.0.0.1')
              Write-Host "hosts block: $hostsBlocked (builds.dotnet.microsoft.com resolves to $ip)"
            } catch {
              Write-Host "hosts file not writable: $($_.Exception.Message)"
            }
            if (-not $hostsBlocked) { Write-Host "::warning::DNS block unavailable; relying on HTTPS_PROXY" }

            $p = Start-Process $app -PassThru `
              -RedirectStandardOutput app-dialog-stdout.txt -RedirectStandardError app-dialog-stderr.txt
            $deadline = (Get-Date).AddSeconds(180)
            while ((Get-Date) -lt $deadline -and -not $p.HasExited -and -not $dialog) {
              $pidCondition = New-Object System.Windows.Automation.PropertyCondition(
                [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
              $windows = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                [System.Windows.Automation.TreeScope]::Children, $pidCondition)
              $titles = @()
              foreach ($window in $windows) {
                $title = $window.Current.Name
                $titles += $title
                if ($title -notlike '*runtime*') { continue }
                $editCondition = New-Object System.Windows.Automation.PropertyCondition(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                  [System.Windows.Automation.ControlType]::Edit)
                foreach ($edit in $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, $editCondition)) {
                  $value = $edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).Current.Value
                  Write-Host "dialog field: $value"
                  # The title is captured here, while the app is alive: reading it
                  # back after the process is gone returns an empty name.
                  if ($value -eq $url) { $dialog = $window; $dialogTitle = $title; break }
                }
              }
              if (-not $dialog) { Start-Sleep -Seconds 2 }
            }
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $hostsBackup) {
              Copy-Item $hostsBackup $hosts -Force
              Remove-Item $hostsBackup -Force
              Write-Host 'hosts file restored'
            }
            if (Test-Path -LiteralPath $stash) {
              Move-Item -LiteralPath $stash -Destination $framework
              Write-Host 'desktop framework restored'
            }
          }

          if ($dialog) {
            Write-Host "Dialog '$dialogTitle' offers the download link: $url"
            exit 0
          }

          # The log says which branch the check took: an install that succeeded
          # means the block leaked, a line about the missing runtime means the
          # window is what failed rather than the state.
          foreach ($cand in $logPaths) {
            if (-not (Test-Path $cand)) { continue }
            Write-Host "=== [runtime] lines from $cand ==="
            Select-String -Path $cand -Pattern '\[runtime\]' | Select-Object -Last 15 | ForEach-Object { Write-Host $_.Line }
          }
          foreach ($stream in 'app-dialog-stdout.txt', 'app-dialog-stderr.txt') {
            if ((Test-Path $stream) -and ((Get-Item $stream).Length -gt 0)) {
              Write-Host "=== $stream ==="; Get-Content $stream | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
            }
          }
          Write-Host "::error::no runtime dialog offering $url appeared for pid $($p.Id); window titles seen: $($titles -join ' | ')"
          exit 1

  # Pushing to main should leave something *downloadable* behind. The app's
  # setup panel checks GitHub at startup and offers Download instead of a
  # local build (MainWindowViewModel.CheckForSidecarUpdatesAsync), so every
  # green main build refreshes a rolling `nightly` prerelease carrying the
  # three CPU sidecars, the split CUDA server, and a SHA256SUMS.txt manifest -
  # the download service refuses bytes it cannot verify. GitHub rejects any
  # asset of 2 GiB or more, so the ~2.5 GB CUDA bundle is split into parts the
  # same way release.yml does for versioned releases. It is a prerelease, so
  # it never displaces the newest versioned tag ("Latest") on the releases
  # page; versioned releases (release.yml, on a `v*` tag) remain the source
  # for the installers.
  publish-nightly:
    name: Publish nightly sidecar release
    runs-on: ubuntu-22.04
    needs: [build, sidecar-cuda]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      # split-release-asset.py lives in the repo, so the sources come first.
      - uses: actions/checkout@v4

      - name: Download the CPU sidecar bundles
        uses: actions/download-artifact@v4
        with:
          pattern: Synapic-{win-x64,linux-x64,osx-arm64}
          path: bundle

      - name: Download the CUDA sidecar bundle
        uses: actions/download-artifact@v4
        with:
          name: Synapic-sidecar-win-x64-cuda
          path: cuda

      # Asset names must match what the app looks for: synapic-inference-<rid>
      # (the .exe suffix on Windows) - see SidecarDownloadService.IsAssetFor.
      - name: Stage the nightly assets
        run: |
          mkdir nightly
          cp bundle/Synapic-win-x64/synapic-inference.exe  nightly/synapic-inference-win-x64.exe
          cp bundle/Synapic-linux-x64/synapic-inference     nightly/synapic-inference-linux-x64
          cp bundle/Synapic-osx-arm64/synapic-inference     nightly/synapic-inference-osx-arm64
          cp cuda/synapic-inference.exe                     nightly/synapic-inference-win-x64-cuda.exe
          ls -lh nightly

      # GitHub rejects any release asset of 2 GiB or more and the CUDA bundle
      # is ~2.5 GB, so it ships as parts plus a reassembly helper - the app
      # joins the parts itself (SidecarDownloadService.ResolveAssetsAsync).
      # The helper also removes the oversized original from the directory.
      - name: Split the CUDA sidecar into uploadable parts
        run: |
          python3 build/split-release-asset.py nightly/synapic-inference-win-x64-cuda.exe --out-dir nightly
          ls -lh nightly

      - name: Checksum every asset
        run: |
          cd nightly
          sha256sum $(ls | grep -v SHA256SUMS.txt) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Recreate rather than edit: the rolling tag must move to this commit,
      # and a fresh release cannot accidentally claim "Latest" as a prerelease.
      - name: Publish the rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly nightly/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly sidecar builds (main)" \
            --notes "Rolling inference sidecars from every green push to main: CPU builds for Windows, Linux and macOS plus the split NVIDIA/CUDA server. Synapic checks this release at startup and offers Download instead of building locally. Verify downloads against SHA256SUMS.txt; join the CUDA parts with the reassemble helper. Installers ship with the versioned releases."
          echo "Published nightly from $GITHUB_SHA"
